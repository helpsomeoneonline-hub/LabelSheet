name: Prepare readable LabelSheet editor source

on:
  push:
    branches: [ "feature/labelsheet-refresh-2026" ]
    paths:
      - ".github/workflows/prepare-readable-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.0 source
        shell: bash
        run: |
          cat source-b64/part-aa.txt source-b64/part-ab.txt source-b64/part-ac.txt source-b64/part-ad.txt source-b64/part-ae.txt > source.b64
          base64 --decode source.b64 > LabelSheet-source.zip
          echo "028e0e7902d7fd29e18d1f89281712b0f12e68290408739d9aa0f4028b56545e  LabelSheet-source.zip" | sha256sum -c -
          unzip -q LabelSheet-source.zip

      - name: Apply 1.1 feature patch
        run: python3 patch-v1.1.py

      - name: Apply 1.2 feature patch
        shell: bash
        run: |
          base64 --decode patch-v1.2.0.gz.b64 | gzip -d > /tmp/LabelSheet-1.2.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.2.0.patch

      - name: Apply 1.3 feature patch
        shell: bash
        run: |
          base64 --decode patch-v1.3.0.gz.b64 | gzip -d > /tmp/LabelSheet-1.3.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.3.0.patch

      - name: Apply 1.4 feature patch
        shell: bash
        run: |
          cat patch-v1.4/part00.txt patch-v1.4/part01.txt patch-v1.4/part02.txt patch-v1.4/part03.txt patch-v1.4/part04.txt > /tmp/patch-v1.4.0.b64
          base64 --decode /tmp/patch-v1.4.0.b64 | gzip -d > /tmp/LabelSheet-1.4.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.4.0.patch

      - name: Fix 1.4 status string
        run: python3 fix-v1.4.py

      - name: Apply 1.5 print and resize patch
        shell: bash
        run: |
          base64 --decode patch-v1.5.0.gz.b64 | gzip -d > /tmp/LabelSheet-1.5.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.5.0.patch

      - name: Apply 1.6 editor workflow patch
        shell: bash
        run: |
          cat patch-v1.6/part00.txt patch-v1.6/part01.txt > /tmp/patch-v1.6.0.b64
          base64 --decode /tmp/patch-v1.6.0.b64 | gzip -d > /tmp/LabelSheet-1.6.0.patch
          cd lsbuild
          patch -p1 < /tmp/LabelSheet-1.6.0.patch


      - name: Apply 1.7 accessibility and multi-picture patch
        run: python3 patch-v1.7.py

      - name: Publish human-readable editable Android source on feature branch
        shell: bash
        run: |
          mkdir -p app
          cp -R lsbuild/app/src app/
          cp lsbuild/app/build.gradle app/
          cp lsbuild/settings.gradle settings.gradle
          if test -f lsbuild/build.gradle; then cp lsbuild/build.gradle build.gradle; fi
          if test -f lsbuild/gradle.properties; then cp lsbuild/gradle.properties gradle.properties; fi
          rm -rf lsbuild
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add app settings.gradle build.gradle gradle.properties 2>/dev/null || git add app settings.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Expose LabelSheet 1.7 Android source for safe redesign"
            git push origin HEAD:feature/labelsheet-refresh-2026
          fi
