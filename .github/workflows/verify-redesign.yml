name: Verify and sign LabelSheet 1.9 redesign
# Re-run the automatic signed build after configuring repository secrets.

on:
  push:
    branches: [ "feature/labelsheet-refresh-2026", "feature/labelsheet-v1.9-redesign" ]
    paths:
      - "app/**"
      - ".github/workflows/verify-redesign.yml"
      - "scripts/sign-github-apk.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile and test LabelSheet source
        run: gradle --no-daemon :app:assembleDebug

      - name: Sign and verify permanent upgrade certificate
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/sign-github-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Read app version
        id: ver
        shell: bash
        run: echo "name=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publish ONLY verified signed APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "LabelSheet-${{ steps.ver.outputs.name }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LabelSheet-${{ steps.ver.outputs.name }}-signed-apk
          path: LabelSheet-${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        shell: bash
        run: |
          tag="labelsheet-v$VERSION"
          apk="LabelSheet-$VERSION.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --title "LabelSheet $VERSION signed APK" --prerelease --target "$GITHUB_SHA" \
              --notes "LabelSheet $VERSION. Signed with the permanent LabelSheet certificate, so it installs over 1.8 and later without uninstalling and keeps your saved sheet."
          fi
