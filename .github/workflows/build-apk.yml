name: Build LabelSheet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack source
        run: unzip -q LabelSheet-build.zip

      - name: Build debug APK
        working-directory: lsbuild
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp lsbuild/app/build/outputs/apk/debug/app-debug.apk LabelSheet-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LabelSheet-1.0.0-apk
          path: LabelSheet-1.0.0.apk
          if-no-files-found: error
