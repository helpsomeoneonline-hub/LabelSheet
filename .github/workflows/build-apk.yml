name: Build LabelSheet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct verified 1.0 source
        shell: bash
        run: |
          cat source-b64/part-aa.txt source-b64/part-ab.txt source-b64/part-ac.txt source-b64/part-ad.txt source-b64/part-ae.txt > source.b64
          base64 --decode source.b64 > LabelSheet-source.zip
          echo "028e0e7902d7fd29e18d1f89281712b0f12e68290408739d9aa0f4028b56545e  LabelSheet-source.zip" | sha256sum -c -
          unzip -q LabelSheet-source.zip

      - name: Apply 1.1 feature patch
        run: python3 patch-v1.1.py

      - name: Apply 1.2 feature patch
        shell: bash
        run: |
          base64 --decode patch-v1.2.0.gz.b64 | gzip -d > /tmp/LabelSheet-1.2.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.2.0.patch

      - name: Apply 1.3 feature patch
        shell: bash
        run: |
          base64 --decode patch-v1.3.0.gz.b64 | gzip -d > /tmp/LabelSheet-1.3.0.patch
          cd lsbuild
          patch -p2 < /tmp/LabelSheet-1.3.0.patch

      - name: Build debug APK
        working-directory: lsbuild
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp lsbuild/app/build/outputs/apk/debug/app-debug.apk LabelSheet-1.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LabelSheet-1.3.0-apk
          path: LabelSheet-1.3.0.apk
          if-no-files-found: error
